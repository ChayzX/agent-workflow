# TEMPLATE ONLY - NOT included in kustomization.yaml, never commit real values.
#
# OCIR (OCI Container Registry) pull secret named `ocir-pull` in the project namespace.
# The credential is an AUTH TOKEN of a DEDICATED IAM user `orch-pull-<project>` that is the
# only member of group `orch-pull-<project>`, whose policy is read-only on this project's
# repositories (`read repos in compartment <project-compartment>`, see
# ../iam-policies.example.txt). Never use a personal user, an admin user, or any credential
# that Pantry Bot uses. Rotate the token on a schedule; OCI limits tokens per user.
#
# Preferred creation (value never touches git or shell history - read it from a file):
#   kubectl -n <PROJECT_NAMESPACE> create secret docker-registry ocir-pull \
#     --docker-server=<REGION_KEY>.ocir.io \
#     --docker-username='<TENANCY_OBJECT_STORAGE_NAMESPACE>/orch-pull-<project>' \
#     --docker-password="$(cat /secure/path/orch-pull-<project>.token)"
#   (Identity-domain users may need '<ns>/<domain>/<user>' - verify against current OCI docs.)
#
# Or sync it from OCI Vault with External Secrets (template.type: kubernetes.io/dockerconfigjson).
#
# Shape for reference - placeholder only:
apiVersion: v1
kind: Secret
metadata:
  name: ocir-pull
  namespace: <PROJECT_NAMESPACE>
  labels:
    orchestrator.dev/layer: guardrails
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"<REGION_KEY>.ocir.io":{"auth":"<base64 of '<namespace>/orch-pull-<project>:<auth-token>' - SET OUT OF BAND>"}}}
