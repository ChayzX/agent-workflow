# Defaults and per-container maximums, so a pod without explicit resources still counts
# against the quota and no single container can take the whole quota.
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  labels:
    orchestrator.dev/layer: guardrails
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 64Mi
      default:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 512Mi
      max:
        cpu: "2"
        memory: 2Gi
        ephemeral-storage: 2Gi
    - type: PersistentVolumeClaim
      min:
        storage: 1Gi
      max:
        storage: 100Gi
