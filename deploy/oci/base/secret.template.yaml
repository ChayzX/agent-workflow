# TEMPLATE ONLY - NOT included in kustomization.yaml, never commit real values.
#
# Recommended: keep secrets in OCI Vault and sync them with the External Secrets Operator
# (ESO), authenticating with OKE workload identity or a dynamic group that can read ONLY
# this project's vault secrets (see ../iam-policies.example.txt). Alternative: Bitnami
# sealed secrets (commit only the SealedSecret ciphertext).
#
# The resulting Kubernetes Secret is named `app-secrets` (no project prefix; the namespace
# already isolates it). Never reuse, copy or reference any Pantry Bot secret or vault.
#
# Field names below follow the ESO OCI Vault provider; verify against the ESO version you
# install and current OCI docs.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: oci-vault
  namespace: <PROJECT_NAMESPACE>
spec:
  provider:
    oracle:
      vault: <PROJECT_VAULT_OCID>       # this project's vault only
      region: <OCI_REGION>              # e.g. eu-frankfurt-1
      principalType: Workload           # OKE workload identity (enhanced clusters)
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: <PROJECT_NAMESPACE>
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: oci-vault
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    - secretKey: DISCORD_BOT_TOKEN
      remoteRef:
        key: <PROJECT>-discord-bot-token     # secret NAME in the project's vault
    - secretKey: TWITCH_CLIENT_SECRET
      remoteRef:
        key: <PROJECT>-twitch-client-secret
---
# Fallback (dev/test only): a plain Secret created out-of-band, e.g.
#   kubectl -n <PROJECT_NAMESPACE> create secret generic app-secrets \
#     --from-env-file=/secure/path/<project>.env      # file never in git, never in an agent session
# Shape for reference - values are placeholders, NOT real secrets:
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: app-secrets
#   namespace: <PROJECT_NAMESPACE>
# type: Opaque
# stringData:
#   DISCORD_BOT_TOKEN: "<set-out-of-band>"
#   TWITCH_CLIENT_SECRET: "<set-out-of-band>"
