# ClusterIP only. Exposure goes through the shared ingress controller (see the
# allow-ingress-from-ingress-controller NetworkPolicy); LoadBalancer/NodePort are blocked
# by the ResourceQuota.
apiVersion: v1
kind: Service
metadata:
  name: app
  labels:
    app.kubernetes.io/name: app
    orchestrator.dev/layer: workload
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: app
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
