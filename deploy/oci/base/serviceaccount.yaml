# Two identities per project, both confined to the project namespace:
#   app      - runs the workload. Has NO RBAC bindings and does not mount an API token.
#   deployer - used by the deploy runner. Bound only to the namespace Role in rbac.yaml.
#              Its tokens are short-lived (`kubectl create token deployer --duration=1h`);
#              no long-lived token Secret is created.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  labels:
    orchestrator.dev/layer: guardrails
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  labels:
    orchestrator.dev/layer: guardrails
automountServiceAccountToken: false
