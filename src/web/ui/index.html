<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Orchestrator Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <h1><a href="#/">Orchestrator</a></h1>
    <nav aria-label="Primary">
      <ul>
        <li><a href="#/">Projects</a></li>
        <li><a href="#/providers">Providers</a></li>
        <li><a href="#/approvals">Approvals <span id="approval-count" class="badge" hidden></span></a></li>
        <li><a href="#/events">Activity</a></li>
        <li><a href="#/new">New project</a></li>
      </ul>
    </nav>
    <button id="logout" type="button" class="ghost" hidden>Sign out</button>
  </header>
  <p id="live" class="visually-hidden" aria-live="polite"></p>
  <main id="main" tabindex="-1">
    <section id="login" hidden aria-labelledby="login-h">
      <h2 id="login-h">Sign in</h2>
      <form id="login-form">
        <label for="token">Dashboard access token</label>
        <input id="token" name="token" type="password" autocomplete="current-password" required>
        <p class="hint">Printed once by <code>orchestrator setup</code>. Rotate with <code>orchestrator dashboard-token</code>.</p>
        <button type="submit">Sign in</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>
    <div id="view"></div>
  </main>
  <dialog id="confirm" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title">Confirm</h2>
      <p id="confirm-body"></p>
      <div class="actions">
        <button value="cancel" autofocus class="ghost">Cancel</button>
        <button value="ok" id="confirm-ok">Confirm</button>
      </div>
    </form>
  </dialog>
</body>
</html>
